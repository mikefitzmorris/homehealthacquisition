[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhpanel"
version = "0.1.0"
description = "Longitudinal ownership x quality panel for Medicare-certified home health agencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["health-services-research", "medicare", "home-health", "cms", "private-equity"]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
hhpanel = "hhpanel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hhpanel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]
